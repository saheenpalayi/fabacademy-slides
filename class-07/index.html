<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="icon" href="../assets/favicon.ico" type="image/x-icon" />
	<title>Class 07 · Computer-Controlled Machining</title>

	<link rel="stylesheet" href="../dist/reset.css" />
	<link rel="stylesheet" href="../dist/reveal.css" />
	<!-- Change the theme here (see reveal/theme/ for options) -->
	<link rel="stylesheet" href="../dist/theme/white.css" />
	<link rel="stylesheet" href="../dist/plugin/highlight/monokai.css" />
	<link rel="stylesheet" href="../assets/deck.css" />
</head>
<body>
	<div class="reveal">
		<div class="slides">
			<!--
				Slides are written in slides.md (same folder).
				  ---  on its own line = next slide (horizontal)
				  --   on its own line = slide below (vertical)
				  Note: = speaker notes (press S)
			-->
			<section
				data-markdown="slides.md"
				data-separator="^\r?\n---\r?\n$"
				data-separator-vertical="^\r?\n--\r?\n$"
				data-separator-notes="^Note:"
			></section>
		</div>
	</div>

	<script src="../dist/reveal.js"></script>
	<script src="../dist/plugin/markdown.js"></script>
	<script src="../dist/plugin/highlight.js"></script>
	<script src="../dist/plugin/notes.js"></script>
	<script src="../dist/plugin/zoom.js"></script>
	<script src="../dist/plugin/search.js"></script>
	<script src="../assets/deck.js"></script>
</body>
</html>
